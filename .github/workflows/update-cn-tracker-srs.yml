name: update-cn-tracker-srs

on:
  workflow_dispatch:
  schedule:
    # 每小时第 20 分执行，避开 update-srs（整点）提交，减少并发推送冲突
    - cron: '20 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update tracker rule-set
        run: |
          chmod +x scripts/update-cn-tracker-list.sh
          ./scripts/update-cn-tracker-list.sh

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sing-box/source/cn-tracker-list.txt sing-box/source/cn-tracker-list.json sing-box/srs/cn-tracker-list.srs
          if git diff --cached --quiet; then
            echo no changes
            exit 0
          fi
          git commit -m "chore: update cn-tracker srs"
          git push
